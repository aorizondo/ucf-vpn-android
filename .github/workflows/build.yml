name: Build

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

jobs:
  build-wstunnel:
    name: Compile wstunnel (arm64 + armv7)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout wstunnel source
        uses: actions/checkout@v4
        with:
          repository: erebe/wstunnel
          ref: v10.5.1
          path: wstunnel-src

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Prefer the NDK that ships with the ubuntu-latest runner
      # (ANDROID_NDK_LATEST_HOME); fall back to installing a pinned NDK.
      - name: Resolve Android NDK
        run: |
          if [ -n "${ANDROID_NDK_LATEST_HOME:-}" ] && [ -d "${ANDROID_NDK_LATEST_HOME}" ]; then
            echo "Using preinstalled NDK: ${ANDROID_NDK_LATEST_HOME}"
            echo "NDK_HOME=${ANDROID_NDK_LATEST_HOME}" >> "${GITHUB_ENV}"
          else
            echo "Preinstalled NDK not found — installing ndk;26.1.10909125"
            yes | sdkmanager --licenses > /dev/null 2>&1 || true
            sdkmanager --install "ndk;26.1.10909125" > /dev/null 2>&1
            echo "NDK_HOME=${ANDROID_HOME}/ndk/26.1.10909125" >> "${GITHUB_ENV}"
          fi

      - name: Build wstunnel for arm64
        working-directory: wstunnel-src
        env:
          CC_aarch64_linux_android: ${{ env.NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          AR_aarch64_linux_android: ${{ env.NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ env.NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
        run: cargo build --release --target aarch64-linux-android

      - name: Build wstunnel for armv7
        working-directory: wstunnel-src
        env:
          CC_armv7_linux_androideabi: ${{ env.NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi24-clang
          AR_armv7_linux_androideabi: ${{ env.NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER: ${{ env.NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi24-clang
        run: |
          # aws-lc-rs (default TLS backend) can fail to cross-compile for
          # 32-bit armv7; fall back to the ring backend if that happens.
          cargo build --release --target armv7-linux-androideabi || {
            echo "::warning::aws-lc-rs build failed for armv7 — retrying with ring backend"
            cargo build --release --no-default-features --features ring --target armv7-linux-androideabi
          }

      - name: Rename and collect binaries
        run: |
          mkdir -p dist
          cp wstunnel-src/target/aarch64-linux-android/release/wstunnel dist/wstunnel_arm64
          cp wstunnel-src/target/armv7-linux-androideabi/release/wstunnel dist/wstunnel_armv7
          chmod +x dist/*
          file dist/*

      - name: Upload wstunnel binaries
        uses: actions/upload-artifact@v4
        with:
          name: wstunnel-android-binaries
          path: dist/

  # hev-socks5-tunnel turns the TUN interface into SOCKS5 traffic. Without it
  # the split-tunnel path cannot run at all: Tun2SocksManager had always
  # referenced a binary that was never committed and that no job produced.
  build-hev-socks5-tunnel:
    name: Compile hev-socks5-tunnel (arm64 + armv7)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout hev-socks5-tunnel source
        uses: actions/checkout@v4
        with:
          repository: heiher/hev-socks5-tunnel
          ref: "2.17.1"
          submodules: recursive
          path: hev-src

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Resolve Android NDK
        run: |
          if [ -n "${ANDROID_NDK_LATEST_HOME:-}" ] && [ -d "${ANDROID_NDK_LATEST_HOME}" ]; then
            echo "NDK_HOME=${ANDROID_NDK_LATEST_HOME}" >> "${GITHUB_ENV}"
          else
            yes | sdkmanager --licenses > /dev/null 2>&1 || true
            sdkmanager --install "ndk;26.1.10909125" > /dev/null 2>&1
            echo "NDK_HOME=${ANDROID_HOME}/ndk/26.1.10909125" >> "${GITHUB_ENV}"
          fi

      # Android.mk defines two modules: a JNI shared library and
      # `hev-socks5-tunnel-bin`, a standalone executable. The SHARED LIBRARY is
      # the one we need: a subprocess never receives the tunnel descriptor,
      # because Android closes descriptors above stderr on exec (measured by
      # FdInheritanceInstrumentedTest), so the executable's `-f <fd>` could never
      # have worked. The library runs in-process instead.
      #
      # PKGNAME/CLSNAME tell hev's JNI_OnLoad which class to bind its natives to;
      # they must match TProxyService.kt exactly or loading fails at runtime.
      - name: Build shared library for arm64 and armv7
        working-directory: hev-src
        run: |
          set -eux
          "${NDK_HOME}/ndk-build" \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=Android.mk \
            APP_ABI="arm64-v8a armeabi-v7a" \
            APP_PLATFORM=android-26 \
            APP_CFLAGS="-DPKGNAME=com/ucfvpn/app/wstunnel -DCLSNAME=TProxyService" \
            NDK_LIBS_OUT=./libs \
            NDK_OUT=./obj \
            -j"$(nproc)"

      - name: Collect shared libraries
        working-directory: hev-src
        run: |
          set -eux
          mkdir -p ../hev-dist
          for abi in arm64-v8a armeabi-v7a; do
            cp "libs/${abi}/libhev-socks5-tunnel.so" "../hev-dist/hev_${abi}.so"
          done
          file ../hev-dist/*
          # The JNI entry point must be present, or the class binding silently
          # never happens and the tunnel fails only on a device.
          for abi in arm64-v8a armeabi-v7a; do
            "${NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm" -D \
              "../hev-dist/hev_${abi}.so" | grep -q "JNI_OnLoad"
          done

      - name: Upload hev-socks5-tunnel binaries
        uses: actions/upload-artifact@v4
        with:
          name: hev-socks5-tunnel-android-binaries
          path: hev-dist/

  build-apk:
    name: Build APK
    needs: [build-wstunnel, build-hev-socks5-tunnel]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Download wstunnel binaries
        uses: actions/download-artifact@v4
        with:
          name: wstunnel-android-binaries
          path: wstunnel-binaries

      # The executables go into jniLibs, NOT assets. Since Android 10, an app
      # with targetSdk >= 29 is denied by SELinux from exec()ing files in its
      # own data directory, so the old "copy from assets to filesDir and chmod"
      # approach fails with Permission denied at launch. Files under
      # jniLibs/<abi>/ are installed read-only and executable in
      # applicationInfo.nativeLibraryDir, which is the only place we may exec
      # from. They must be named lib*.so or the installer skips them.
      - name: Download hev-socks5-tunnel binaries
        uses: actions/download-artifact@v4
        with:
          name: hev-socks5-tunnel-android-binaries
          path: hev-binaries

      - name: Package native executables into jniLibs
        run: |
          set -eux
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/jniLibs/armeabi-v7a
          cp wstunnel-binaries/wstunnel_arm64 app/src/main/jniLibs/arm64-v8a/libwstunnel.so
          cp wstunnel-binaries/wstunnel_armv7 app/src/main/jniLibs/armeabi-v7a/libwstunnel.so
          cp hev-binaries/hev_arm64-v8a.so app/src/main/jniLibs/arm64-v8a/libhev-socks5-tunnel.so
          cp hev-binaries/hev_armeabi-v7a.so app/src/main/jniLibs/armeabi-v7a/libhev-socks5-tunnel.so
          ls -la app/src/main/jniLibs/*/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          gradle-version: wrapper

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create debug keystore for signing
        run: |
          keytool -genkey -v -keystore app/debug.keystore \
            -alias androiddebugkey -storepass android -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug, O=Android, C=US"

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Run JVM unit tests
        run: ./gradlew test --stacktrace

      # Without this the console log only says "AssertionError at Foo.kt:48",
      # with no expected/actual values — which makes a red build very hard to
      # diagnose when tests only ever run here.
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: warn

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  instrumented-tests:
    name: Instrumented tests (Emulator API 29)
    # Without these the job built an APK with no native executables, so any test
    # touching them exercised the "missing binary" path only by accident.
    needs: [build-wstunnel, build-hev-socks5-tunnel]
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Download wstunnel binaries
        uses: actions/download-artifact@v4
        with:
          name: wstunnel-android-binaries
          path: wstunnel-binaries

      - name: Download hev-socks5-tunnel binaries
        uses: actions/download-artifact@v4
        with:
          name: hev-socks5-tunnel-android-binaries
          path: hev-binaries

      - name: Package native executables into jniLibs
        run: |
          set -eux
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/jniLibs/armeabi-v7a
          cp wstunnel-binaries/wstunnel_arm64 app/src/main/jniLibs/arm64-v8a/libwstunnel.so
          cp wstunnel-binaries/wstunnel_armv7 app/src/main/jniLibs/armeabi-v7a/libwstunnel.so
          cp hev-binaries/hev_arm64-v8a.so app/src/main/jniLibs/arm64-v8a/libhev-socks5-tunnel.so
          cp hev-binaries/hev_armeabi-v7a.so app/src/main/jniLibs/armeabi-v7a/libhev-socks5-tunnel.so

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          gradle-version: wrapper

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create debug keystore for signing
        run: |
          keytool -genkey -v -keystore app/debug.keystore \
            -alias androiddebugkey -storepass android -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug, O=Android, C=US"

      - name: Run instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          disable-animations: true
          script: ./gradlew connectedCheck --stacktrace

      # Same reason as the JVM reports: without the HTML/XML the console only
      # gives "The component is not displayed!" with no idea which node or why.
      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn
