name: Build

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

jobs:
  build-wstunnel:
    name: Compile wstunnel (arm64 + armv7)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout wstunnel source
        uses: actions/checkout@v4
        with:
          repository: erebe/wstunnel
          ref: v10.5.1
          path: wstunnel-src

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Prefer the NDK that ships with the ubuntu-latest runner
      # (ANDROID_NDK_LATEST_HOME); fall back to installing a pinned NDK.
      - name: Resolve Android NDK
        run: |
          if [ -n "${ANDROID_NDK_LATEST_HOME:-}" ] && [ -d "${ANDROID_NDK_LATEST_HOME}" ]; then
            echo "Using preinstalled NDK: ${ANDROID_NDK_LATEST_HOME}"
            echo "NDK_HOME=${ANDROID_NDK_LATEST_HOME}" >> "${GITHUB_ENV}"
          else
            echo "Preinstalled NDK not found — installing ndk;26.1.10909125"
            yes | sdkmanager --licenses > /dev/null 2>&1 || true
            sdkmanager --install "ndk;26.1.10909125" > /dev/null 2>&1
            echo "NDK_HOME=${ANDROID_HOME}/ndk/26.1.10909125" >> "${GITHUB_ENV}"
          fi

      - name: Build wstunnel for arm64
        working-directory: wstunnel-src
        env:
          CC_aarch64_linux_android: ${{ env.NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          AR_aarch64_linux_android: ${{ env.NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ env.NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
        run: cargo build --release --target aarch64-linux-android

      - name: Build wstunnel for armv7
        working-directory: wstunnel-src
        env:
          CC_armv7_linux_androideabi: ${{ env.NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi24-clang
          AR_armv7_linux_androideabi: ${{ env.NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER: ${{ env.NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi24-clang
        run: |
          # aws-lc-rs (default TLS backend) can fail to cross-compile for
          # 32-bit armv7; fall back to the ring backend if that happens.
          cargo build --release --target armv7-linux-androideabi || {
            echo "::warning::aws-lc-rs build failed for armv7 — retrying with ring backend"
            cargo build --release --no-default-features --features ring --target armv7-linux-androideabi
          }

      - name: Rename and collect binaries
        run: |
          mkdir -p dist
          cp wstunnel-src/target/aarch64-linux-android/release/wstunnel dist/wstunnel_arm64
          cp wstunnel-src/target/armv7-linux-androideabi/release/wstunnel dist/wstunnel_armv7
          chmod +x dist/*
          file dist/*

      - name: Upload wstunnel binaries
        uses: actions/upload-artifact@v4
        with:
          name: wstunnel-android-binaries
          path: dist/

  build-apk:
    name: Build APK
    needs: build-wstunnel
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Download wstunnel binaries
        uses: actions/download-artifact@v4
        with:
          name: wstunnel-android-binaries
          path: wstunnel-binaries

      - name: Copy wstunnel binaries to assets
        run: |
          mkdir -p app/src/main/assets
          cp wstunnel-binaries/wstunnel_arm64 app/src/main/assets/wstunnel_arm64
          cp wstunnel-binaries/wstunnel_armv7 app/src/main/assets/wstunnel_armv7
          chmod +x app/src/main/assets/wstunnel_*

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          gradle-version: wrapper

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create debug keystore for signing
        run: |
          keytool -genkey -v -keystore app/debug.keystore \
            -alias androiddebugkey -storepass android -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug, O=Android, C=US"

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Run JVM unit tests
        run: ./gradlew test --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  instrumented-tests:
    name: Instrumented tests (Emulator API 29)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          gradle-version: wrapper

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create debug keystore for signing
        run: |
          keytool -genkey -v -keystore app/debug.keystore \
            -alias androiddebugkey -storepass android -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug, O=Android, C=US"

      - name: Run instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          disable-animations: true
          script: ./gradlew connectedCheck --stacktrace
